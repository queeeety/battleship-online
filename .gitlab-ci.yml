# Runs on every push and merge request: lint, typecheck and tests in parallel, then a production build.
# On main it then deploys the live site to Vercel.
# Uses the DCU shared runner (untagged jobs). Node 22 meets Next 16's >= 20.9.

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

stages:
  - install
  - check
  - build
  - deploy

# fills the npm cache once so the other jobs only pull it
install:
  stage: install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - echo "Dependencies installed and cached"

lint:
  stage: check
  script:
    - npm run lint

typecheck:
  stage: check
  script:
    # generate Next's route types (LayoutProps etc.) so tsc can find them
    - npx next typegen
    - npm run typecheck

test:
  stage: check
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build

# publishes main to https://ooad-battleship.vercel.app once everything above passes. Vercel builds it
# with the Supabase keys set in the Vercel project. Needs VERCEL_TOKEN as a protected, masked CI/CD
# variable.
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $VERCEL_TOKEN
  # nothing to install: the Vercel CLI uploads the source and Vercel runs the build
  cache: []
  before_script: []
  variables:
    VERCEL_ORG_ID: team_Q1evxiwchtBMNyzzJwllAuCQ
    VERCEL_PROJECT_ID: prj_8vDX6h14fFwT9lRPlY5WguAWrjKU
  # one deploy at a time
  resource_group: production
  environment:
    name: production
    url: https://ooad-battleship.vercel.app
  script:
    - npx --yes vercel@65.11.0 deploy --prod --yes --token "$VERCEL_TOKEN"
