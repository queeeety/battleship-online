# Applies new files in supabase/migrations to the hosted Supabase project when they reach main.
# Run it by hand (Actions -> Database migrations -> Run workflow) to set up a fresh project.
#
# Repository variable:
#   SUPABASE_PROJECT_ID    the project ref, the part before .supabase.co in the project URL.
#                          The job is skipped until it is set.
# Repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created

name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# never run two migrations against the same database at once
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to Supabase
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # pinned: CLI 3 changed db push to target the local stack unless told otherwise
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # --yes: CI has no terminal to confirm the push in
      - run: supabase db push --remote --yes
